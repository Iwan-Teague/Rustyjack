# cargo-deny configuration — rustyjack (AQ-73 baseline supply-chain scaffold).
# Gate in CI: `cargo deny check advisories bans sources`.
# NOTE: `licenses` is intentionally NOT gated in CI yet — the PolyForm/MPL
# allow-list ruling is pending owner decision OI-05 (wave10 audit README.md B4).
# The allow list below records the MEASURED licence set of the current graph
# (cargo-deny 0.20.2, `cargo deny list`, all features) and is a fact-record,
# not a policy decision.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # fiat-crypto (transitive via ring-adjacent crypto stacks) is BSD-1-Clause.
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots bundles Mozilla's root store under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
    # unescaper declares "GPL-3.0/MIT" (disjunction); the MIT arm satisfies the
    # allow list, so GPL-3.0 is deliberately NOT granted blanket approval.
    "ISC",
    # r-efi (transitive, UEFI target helpers) declares LGPL-2.1-or-later.
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    # serialport is MPL-2.0 — file-level copyleft.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 1.0
# Unlicensed crates are denied by default (licenses v2); any crate whose
# licence does not match the allow list fails a local licenses check.

[bans]
multiple-versions = "warn"
# Ratcheting note: "deny" is the goal, but every member manifest in this
# workspace currently uses two-component caret requirements (e.g. "0.2"),
# which cargo-deny classifies as wildcards (measured: 36 hits at HEAD).
# Held at "warn" so the scaffold does not fail CI on day one; tighten to
# "deny" as manifests are migrated to three-component requirements.
wildcards = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
# advisories v2: vulnerability / unmaintained / unsound are checked for the
# whole graph by default at error (deny) severity; `yanked` is the only
# severity-tunable field and is pinned to "deny" here.
yanked = "deny"
ignore = [
    # git2 0.19.0 (declared by rustyjack-core as "0.19" with vendored-libgit2).
    # Three unsound advisories have no 0.19.x fix: RUSTSEC-2026-0008 (needs
    # >=0.20.4), RUSTSEC-2026-0183 / RUSTSEC-2026-0184 (need >=0.21.0). A bump
    # to git2 = "0.21" was attempted on 2026-09-20 and failed to compile
    # (120 errors in rustyjack-core: libgit2 API changed). Waived as a
    # fail-closed triage decision; requires a dedicated API-migration patch.
    # TODO(revisit) by 2026-12-20.
    "RUSTSEC-2026-0008",
    "RUSTSEC-2026-0183",
    "RUSTSEC-2026-0184",

    # Unmaintained: RUSTSEC-2024-0436 paste 1.x (proc-macro, transitively
    # pulled; measured 2026-09-20). TODO(revisit) by 2026-12-20.
    "RUSTSEC-2024-0436",
]
